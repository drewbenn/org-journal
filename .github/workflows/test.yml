name: CI

on:
  push:
    paths-ignore:
      - CHANGELOG
      - CONTRIBUTORS
      - LICENSE
      - MAINTAINERS
      - README.org
      - org-journal.svg

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        emacs-version:
          - 29.4
        experimental: [false]

    steps:
    - uses: jcs090218/setup-emacs@master
      with:
        version: ${{ matrix.emacs-version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    - uses: actions/checkout@v4

    - name: Run tests
      run: make all
